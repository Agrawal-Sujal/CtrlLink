# ==============================================================================
# CtrlLink Nginx Configuration - Local Testing (Host Services Mode)
# ==============================================================================
# Use this configuration when running Nginx in Docker to reverse-proxy to
# backend and frontend services that are running directly on your host machine
# (e.g. Spring Boot running in IntelliJ or via ./mvnw, and Vite running via npm run dev).
# ==============================================================================

# ── Upstream Definitions for Host Services ───────────────────────────────────
upstream backend {
    # Points to host machine port 8080
    server host.docker.internal:8080;
}

upstream frontend {
    # Points to host machine port 3000 (or change to 5173 if using default Vite dev port)
    server host.docker.internal:3000;
}

# ── Logging Format ───────────────────────────────────────────────────────────
log_format detailed_local '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" rt=$request_time urt=$upstream_response_time req_id=$request_id';

server {
    listen 80;
    listen 3000;
    server_name localhost 127.0.0.1 _;

    access_log /dev/stdout detailed_local;
    error_log /dev/stderr warn;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Pass Request ID downstream and to client for distributed tracing
    add_header X-Request-ID $request_id always;

    # ── Proxy REST API requests to Spring Boot backend ────────────────────────
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;

        # Generous timeouts for local debugging and breakpoints
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Proxy Short Link Redirects to Spring Boot backend ─────────────────────
    location /redirect/ {
        proxy_pass http://backend/redirect/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Proxy Swagger UI & OpenAPI Docs to Backend (Local Testing & API Exploration)
    location /swagger-ui/ {
        proxy_pass http://backend/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy Spring Boot Actuator endpoints for Local Health Checks ──────────
    location /actuator/ {
        proxy_pass http://backend/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy all other requests to React frontend (including Vite dev server / preview)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
    }
}
