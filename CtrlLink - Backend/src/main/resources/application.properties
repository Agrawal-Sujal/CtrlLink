spring.application.name=ctrllink
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Base URL
app.base-url=${APP_BASE_URL}
app.frontend-url=${APP_FRONTEND_URL}
app.allowed-origin=${APP_ALLOWED_ORIGIN}

# Batch ID Allocation (In-Memory Buffer)
app.url.id-batch-size=${APP_URL_ID_BATCH_SIZE}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis Configuration (Supports local Redis and cloud providers like Upstash)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=60s

# Logging configuration
spring.output.ansi.enabled=ALWAYS
logging.level.com.sunflower.ctrllink=${LOGGING_LEVEL_APP:DEBUG}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.org.apache.tomcat.util.http.parser.Cookie=WARN
logging.level.org.apache.coyote.http11.Http11Processor=ERROR
spring.jpa.open-in-view=false

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.datatype.datetime.write-date-timestamps-as-nanoseconds=false


# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS}
app.encryption.secret=${APP_ENCRYPTION_SECRET}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID}

# Email (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Flyway configuration
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Actuator Monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.show-details=always
management.health.mail.enabled=false
#management.endpoints.web.exposure.include=health,info,metrics



# Database Connection Pool (High-Density Clustering)
# Set to 2 per node to ensure 3 replicas (6 total) fit within Azure's 10-connection limit
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
