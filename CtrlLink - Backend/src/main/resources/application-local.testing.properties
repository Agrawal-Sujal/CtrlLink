# ==============================================================================
# Spring Boot Configuration Profile: local.testing
# ==============================================================================
# Activate this profile with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local.testing
# Or set environment variable:
#   SPRING_PROFILES_ACTIVE=local.testing
# ==============================================================================

spring.application.name=ctrllink

# Local PostgreSQL Configuration
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=CtrlLink
POSTGRES_USER=admin
POSTGRES_PASSWORD=admin
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:CtrlLink}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

# Base URLs pointing strictly to local machine
APP_BASE_URL=http://localhost:8080
app.base-url=${APP_BASE_URL}
app.redirect-base-url=${REDIRECT_BASE_URL:${APP_BASE_URL}}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:3000,http://localhost:80,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}

# In-Memory Batch ID Allocation
app.url.id-batch-size=100

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Local Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=60s

# Logging configuration for local testing
spring.output.ansi.enabled=ALWAYS
logging.level.com.sunflower.ctrllink=DEBUG
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
spring.jpa.open-in-view=false

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.datatype.datetime.write-date-timestamps-as-nanoseconds=false

# Security & JWT Tokens
app.jwt.secret=${APP_JWT_SECRET:my-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.encryption.secret=${APP_ENCRYPTION_SECRET:my-ultra-secret-key-32-chars-long}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:671534648137-qi5mvbmdf3paikng3stn3dnosv2bv3rs.apps.googleusercontent.com}

# Email (Gmail SMTP) Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:sujalagrawal2700@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:xdae oroz jovu jjnr}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Flyway Database Migrations
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Actuator Monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.show-details=always
management.health.mail.enabled=false

# Database Connection Pool (Sized for local development and testing)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
