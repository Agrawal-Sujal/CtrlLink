spring.application.name=ctrllink
spring.datasource.url=jdbc:postgresql://localhost:5432/CtrlLink
spring.datasource.username=admin
spring.datasource.password=admin

app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000
app.allowed-origin=http://localhost:3000

app.url.id-batch-size=100

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.jwt.secret=my-super-secret-key-that-is-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000
app.encryption.secret=my-ultra-secret-key-32-chars-long

app.google.client-id=671534648137-qi5mvbmdf3paikng3stn3dnosv2bv3rs.apps.googleusercontent.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

management.endpoints.web.exposure.include=*
management.health.mail.enabled=false
