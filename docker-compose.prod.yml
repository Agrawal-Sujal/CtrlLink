services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ctrllink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctrllink-network

  # ── Redis Cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ctrllink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctrllink-network

  # ── Backend Application (Spring Boot 4 / Java 21) ─────────────────────────
  backend:
    platform: linux/amd64
    build:
      context: "./CtrlLink - Backend"
      dockerfile: Dockerfile
    image: sujalagrawal47/ctrllink-backend:latest
    container_name: ctrllink-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      APP_BASE_URL: ${APP_BASE_URL}
      REDIRECT_BASE_URL: ${REDIRECT_VITE_API_BASE_URL:-${APP_BASE_URL}}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN}
      APP_URL_ID_BATCH_SIZE: ${APP_URL_ID_BATCH_SIZE}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS}
      APP_ENCRYPTION_SECRET: ${APP_ENCRYPTION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      LOGGING_LEVEL_APP: ${LOGGING_LEVEL_APP:-INFO}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      SPRING_OUTPUT_ANSI_ENABLED: NEVER
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ctrllink-network

  # ── Frontend Application (React / Vite) ───────────────────────────────────
  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        REDIRECT_VITE_API_BASE_URL: ${REDIRECT_VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    image: sujalagrawal47/ctrllink-frontend:latest
    container_name: ctrllink-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ctrllink-network

  # ── Nginx Reverse Proxy / Gateway ─────────────────────────────────────────
  nginx:
    platform: linux/amd64
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: sujalagrawal47/ctrllink-nginx:latest
    container_name: ctrllink-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - ctrllink-network

networks:
  ctrllink-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
