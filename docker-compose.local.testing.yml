# ==============================================================================
# CtrlLink Docker Compose - Local Testing
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.local.testing.yml --env-file .env.local.testing up --build
# Or detached:
#   docker compose -f docker-compose.local.testing.yml --env-file .env.local.testing up --build -d
# ==============================================================================

services:

  # ── PostgreSQL Database (Local Testing) ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ctrllink-postgres-local-testing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CtrlLink}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_testing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-CtrlLink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctrllink-network

  # ── Redis Cache (Local Testing) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ctrllink-redis-local-testing
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_local_testing_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctrllink-network

  # ── Backend Application (Spring Boot 4 / Java 21) ─────────────────────────
  backend:
    build:
      context: "./CtrlLink - Backend"
      dockerfile: Dockerfile
    container_name: ctrllink-backend-local-testing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-CtrlLink}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      REDIRECT_BASE_URL: ${REDIRECT_VITE_API_BASE_URL:-http://localhost:8080}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:3000,http://localhost:80,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
      APP_URL_ID_BATCH_SIZE: ${APP_URL_ID_BATCH_SIZE:-100}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-my-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_ENCRYPTION_SECRET: ${APP_ENCRYPTION_SECRET:-my-ultra-secret-key-32-chars-long}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      LOGGING_LEVEL_APP: ${LOGGING_LEVEL_APP:-DEBUG}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      SPRING_OUTPUT_ANSI_ENABLED: ALWAYS
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ctrllink-network

  # ── Frontend Application (React / Vite) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        REDIRECT_VITE_API_BASE_URL: ${REDIRECT_VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: ctrllink-frontend-local-testing
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ctrllink-network

  # ── Nginx Reverse Proxy / Gateway (Local Testing) ─────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.local.testing
    container_name: ctrllink-nginx-local-testing
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - ./nginx/nginx.local.testing.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ctrllink-network

networks:
  ctrllink-network:
    driver: bridge

volumes:
  postgres_local_testing_data:
  redis_local_testing_data:
