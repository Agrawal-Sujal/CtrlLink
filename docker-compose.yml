services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: CtrlLink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CtrlLink}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-CtrlLink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctrllink-network

  # ── Redis Cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ctrllink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctrllink-network

  # ── Backend Application (Spring Boot 4 / Java 21) ─────────────────────────
  backend:
    build:
      context: "./CtrlLink - Backend"
      dockerfile: Dockerfile
    container_name: ctrllink-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-CtrlLink}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:3000}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-my-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
      APP_ENCRYPTION_SECRET: ${APP_ENCRYPTION_SECRET:-my-ultra-secret-key-32-chars-long}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-671534648137-qi5mvbmdf3paikng3stn3dnosv2bv3rs.apps.googleusercontent.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ctrllink-network

  # ── Frontend Application (React / Vite / Nginx) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-671534648137-qi5mvbmdf3paikng3stn3dnosv2bv3rs.apps.googleusercontent.com}
    container_name: ctrllink-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - ctrllink-network

networks:
  ctrllink-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
